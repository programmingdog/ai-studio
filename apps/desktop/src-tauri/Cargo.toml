[package]
name = "ai-video-studio"
version = "0.1.0"
description = "Local-first AI video production workstation"
authors = ["AI Video Studio"]
edition = "2021"

[lib]
name = "ai_video_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tauri-plugin-dialog = "2"
base64 = "0.22"
keyring = { version = "3", features = ["windows-native", "apple-native"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["fs", "time", "sync", "rt", "io-util"] }
tokio-util = { version = "0.7", features = ["io"] }
